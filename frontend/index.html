<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CutMap 地形浏览</title>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="hud">
    <div id="hud-title">地形瓦片</div>
    <div id="hud-meta">正在读取 layer.json…</div>
    <div id="hud-status"><span class="dot"></span><span id="hud-status-text">初始化</span></div>
  </div>

  <div id="controls">
    <label>垂直夸张 <input id="exaggeration" type="range" min="1" max="5" step="0.5" value="2">
      <span id="exaggeration-text">2.0x</span></label>
    <label>底图
      <select id="basemap">
        <option value="ion">Cesium Ion 影像（Bing，在线）</option>
        <option value="local">本地（离线）</option>
        <option value="none">关闭</option>
        <option value="osm">OSM（在线）</option>
      </select></label>
    <label>影像 <input id="opacity" type="range" min="0" max="100" step="5" value="100">
      <span id="opacity-text">100%</span></label>
    <label><input id="lighting" type="checkbox"> 光照</label>
    <label><input id="boundary" type="checkbox" checked> 边界</label>
    <label><input id="clip" type="checkbox"> 边界外裁掉</label>
    <button id="fly-home">回到范围</button>
    <button id="toggle-debug">诊断</button>
  </div>

  <div id="readout"></div>
  <div id="panel" class="hidden"><div id="log"></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
